name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Ubuntu Linux CI (Gates, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libgtk-3-dev \
            desktop-file-validate \
            appstream

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check (cargo fmt)
        run: cargo fmt --check

      - name: Architecture Layering (xtask layers)
        run: cargo run -p xtask -- layers

      - name: Asset Attributions (xtask assets)
        run: cargo run -p xtask -- assets

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

      - name: WASM Check (xtask wasm)
        run: cargo run -p xtask -- wasm

      - name: Build FilmCraft Release Binaries
        run: cargo build --release -p filmcraft -p filmcraft-cli
