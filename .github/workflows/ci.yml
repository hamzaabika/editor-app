name: Linux Build (.deb)

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build Linux .deb Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies & nfpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libgtk-3-dev \
            desktop-file-utils \
            appstream
          curl -LO https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_amd64.deb
          sudo dpkg -i nfpm_2.41.3_amd64.deb
          rm -f nfpm_2.41.3_amd64.deb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build & Package .deb
        run: |
          bash packaging/linux/package.sh --formats "deb"

      - name: Upload .deb Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-linux-deb
          path: dist/release/*.deb
          if-no-files-found: error
